spring.application.name=delivery-tracker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/delivery_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-migration-naming=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
