<main class="delivery-tracker">
  <h1>Delivery Tracker</h1>

  <app-delivery-search
    [(trackingCode)]="trackingCode"
    [isSearching]="isSearching()"
    (searchRequested)="searchDelivery($event)"
  />

  <app-delivery-create
    [(recipientName)]="newRecipientName"
    [isCreating]="isCreating()"
    (createRequested)="createNewDelivery($event)"
  />

  <app-delivery-list (deliverySelected)="viewDelivery($event)" />

  @if (deliveryResult) {
    <app-delivery-details
      [delivery]="deliveryResult"
      [statusTransitionError]="statusTransitionError"
      [statusBeingUpdated]="statusBeingUpdated()"
      (statusUpdateRequested)="updateStatus($event)"
    />
  }
</main>
