<div style="padding: 50px; display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 20px;">
  
  <h1>Rastreador de Entregas</h1>

  <mat-form-field appearance="outline" style="width: 100%; max-width: 400px;">
    <mat-label>Código de Rastreio</mat-label>
    <input matInput placeholder="Ex: BR123">
    <button mat-icon-button matSuffix>
      <mat-icon>search</mat-icon>
    </button>
  </mat-form-field>

  <mat-card style="width: 100%; max-width: 400px;">
    <mat-card-header>
      <mat-card-title>Status: EM TRÂNSITO</mat-card-title>
      <mat-card-subtitle>Código: BR123</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p style="margin-top: 15px;"><strong>Destinatário:</strong> Cliente Teste</p>
      <p><strong>Última atualização:</strong> Hoje</p>
    </mat-card-content>
  </mat-card>

</div>
