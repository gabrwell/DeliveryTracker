<div style="padding: 50px; display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 20px;">
  
  <h1>Delivery Tracker</h1>

  <mat-form-field appearance="outline" style="width: 100%; max-width: 400px;">
    <mat-label>Tracking Code</mat-label>
    <input matInput placeholder="Ex: BR123" [(ngModel)]="trackingCode">
    <button mat-icon-button matSuffix (click)="searchDelivery()">
      <mat-icon>search</mat-icon>
    </button>
  </mat-form-field>

  <mat-card style="width: 100%; max-width: 400px;">
    <mat-card-header>
      <mat-card-title>Status: IN TRANSIT</mat-card-title>
      <mat-card-subtitle>Code: BR123</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p style="margin-top: 15px;"><strong>Recipient:</strong> Cliente Teste</p>
      <p><strong>Last Update:</strong> Today</p>
    </mat-card-content>
  </mat-card>

  <p style="color: gray;">You are typing: <strong>{{ trackingCode }}</strong></p>

</div>
